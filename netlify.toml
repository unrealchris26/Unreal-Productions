# ==========================================================================
# Netlify configuration — Unreal Productions
# ==========================================================================

[build]
  # Static site: nothing to compile. Netlify serves the repo root as-is.
  publish = "."
  command = ""
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# --------------------------------------------------------------------------
# Security headers
# --------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), interest-cohort=()"
    # Allows Google Fonts, the YouTube embed and our own inline JSON-LD.
    Content-Security-Policy = "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self' 'unsafe-inline'; media-src 'self'; frame-src https://www.youtube-nocookie.com https://www.youtube.com; connect-src 'self'; base-uri 'self'; form-action 'self'"

# Long-cache fingerprint-free static assets. Bump a filename to bust.
[[headers]]
  for = "/assets/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

# --------------------------------------------------------------------------
# Pretty URLs for the legal pages
# --------------------------------------------------------------------------
[[redirects]]
  from = "/privacy"
  to = "/privacy-policy.html"
  status = 301

[[redirects]]
  from = "/privacy-policy"
  to = "/privacy-policy.html"
  status = 301

[[redirects]]
  from = "/terms"
  to = "/terms.html"
  status = 301

# The function itself declares `path = "/api/lead"`, so the browser uses the
# same endpoint on Netlify and Vercel. This keeps the historical path working
# for any client that cached it.
[[redirects]]
  from = "/.netlify/functions/lead"
  to = "/api/lead"
  status = 308
  force = true
